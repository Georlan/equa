name: Testar EQUA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  jogo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar lógica e interações do jogo
        run: node --test
